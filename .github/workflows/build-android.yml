name: Build Android

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main, 'feature/**']
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/clients

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/clients/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node dependencies
        run: npm ci

      - name: Build product web assets
        run: npm run build:product

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Validate Gradle wrapper
        working-directory: src/clients/android
        run: chmod +x gradlew && ./gradlew --version

      - name: Build debug APK
        working-directory: src/clients/android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: scopeseal-android-debug
          path: src/clients/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
