name: Build iOS

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main, 'feature/**']
  workflow_dispatch:

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src/clients

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/clients/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Build product web assets
        run: npm run build:product

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build for iOS Simulator
        working-directory: src/clients/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scopeseal-ios-simulator-log
          path: src/clients/ios/App/build.log
          retention-days: 3
        continue-on-error: true
