name: CI Backend

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scopeseal
          POSTGRES_USER: scopeseal
          POSTGRES_PASSWORD: scopeseal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scopeseal -d scopeseal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ScopeSeal.slnx

      - name: Build
        run: dotnet build ScopeSeal.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ScopeSeal.slnx --no-build --configuration Release --verbosity normal
        env:
          ConnectionStrings__Default: Host=localhost;Port=5432;Database=scopeseal;Username=scopeseal;Password=scopeseal_ci
          ScopeSeal__Auth__JwtSecret: ci-test-secret-minimum-32-characters-long
