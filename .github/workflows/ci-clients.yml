name: CI Clients

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-clients-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-clients:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/clients

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/clients/package-lock.json

      - name: Install
        run: npm ci

      - name: Build product app
        run: npm run build:product

      - name: Build marketing site
        run: npm run build:marketing

      - name: Build admin portal
        run: npm run build:admin

      - name: Accessibility foundation audit
        run: npm run audit:a11y
