name: CI Security

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  dotnet-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ScopeSeal.slnx
      - name: NuGet audit
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee audit-output.txt
          if grep -qi "has the following vulnerable" audit-output.txt; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/clients
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/clients/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
