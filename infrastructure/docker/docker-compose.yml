# Local Windows isolated dev infrastructure (PostgreSQL + Azurite).
# See docker-compose.local.yml at repo root — kept here for discoverability.
services:
  postgres:
    profiles: ["local"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scopeseal
      POSTGRES_USER: scopeseal
      POSTGRES_PASSWORD: scopeseal_dev
    ports:
      - "5432:5432"
    volumes:
      - scopeseal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scopeseal -d scopeseal"]
      interval: 5s
      timeout: 5s
      retries: 10

  azurite:
    profiles: ["local"]
    image: mcr.microsoft.com/azure-storage/azurite:3.34.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - scopeseal_azurite:/data

volumes:
  scopeseal_pgdata:
  scopeseal_azurite:
