# SonarQube scan config for ScopeSeal.
# Server: http://192.168.1.8:7001 — source SONAR_URL + SONAR_TOKEN from
# J:\Projects\Architonix\DockerSecurity\code-platform\scan.env (never commit tokens).
sonar.projectKey=architonix-scopeseal
sonar.projectName=ScopeSeal
sonar.projectVersion=0.0.0

sonar.sources=src/backend,src/clients/projects
sonar.tests=src/backend/tests,src/clients/projects
sonar.test.inclusions=**/*Tests.cs,**/*.spec.ts,**/*.test.ts

sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/dist/**,**/.angular/**,**/coverage/**,**/android/**,**/ios/**
sonar.sourceEncoding=UTF-8

# .NET coverage (when generated): sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml
